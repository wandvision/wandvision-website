# ============================================================
# HEADERS
# ============================================================

# HTML stranice - kratki cache jer se sadrzaj mijenja
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-XSS-Protection = "1; mode=block"

    # Izolacija prozora od cross-origin stranica (COOP)
    Cross-Origin-Opener-Policy = "same-origin"

    # Content Security Policy — zaštita od XSS i injection napada
    # VAŽNO: Prilagodi 'script-src' i 'style-src' ako koristiš externe skripte!
    #
    # Trenutno dozvoljeno:
    #   - default-src 'self'          → svi resursi samo s vlastite domene
    #   - script-src 'self'           → JS samo s vlastite domene
    #     + fonts.googleapis.com      → Google Fonts CSS
    #     + resend.com                → Resend API (za netlify funkciju)
    #   - style-src 'self' 'unsafe-inline' → inline stilovi dozvoljeni (potrebno za HTML email template)
    #   - img-src 'self' data: blob:  → slike + base64 (za konfigurator foto upload)
    #   - connect-src 'self' https://api.resend.com → fetch pozivi prema Resend API-u
    #   - font-src 'self' fonts.gstatic.com → Google Fonts fajlovi
    #   - frame-ancestors 'none'      → pojačava X-Frame-Options DENY
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self' https://api.resend.com https://script.google.com; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self';"

# CSS i JS - duzi cache, fingerprinting nije implementiran pa 1 dan
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Slike - dugi cache
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Sitemap
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

# Robots.txt
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
